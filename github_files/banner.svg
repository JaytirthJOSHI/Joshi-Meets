<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Joshi Meets — joshi1.com">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#140a0c"/>
      <stop offset="50%" style="stop-color:#1a0f14"/>
      <stop offset="100%" style="stop-color:#2a1215"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="55%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g opacity="0.14" fill="none" stroke="#ef4444" stroke-width="1">
    <path d="M0 120 Q300 80 600 120 T1200 100"/>
    <path d="M0 200 Q400 260 800 200 T1200 220"/>
    <path d="M0 280 Q350 240 700 280 T1200 300"/>
  </g>
  <circle cx="980" cy="90" r="120" fill="#ef4444" opacity="0.09"/>
  <circle cx="180" cy="320" r="90" fill="#f87171" opacity="0.07"/>
  <text x="80" y="175" fill="#fef2f2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.02em">Joshi Meets</text>
  <text x="80" y="230" fill="url(#accent)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600" filter="url(#glow)">joshi1.com</text>
  <text x="80" y="295" fill="#a8a29e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="400">Secure video — powered by LiveKit · built on open-source plugNmeet</text>
  <rect x="80" y="330" width="200" height="4" rx="2" fill="url(#accent)"/>
